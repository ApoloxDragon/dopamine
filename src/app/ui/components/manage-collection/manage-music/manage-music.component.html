<div class="p-4">
    <div class="title" data-settings-section="folders">{{ 'folders' | translate }}</div>
    <div>{{ 'add-folders-with-your-music' | translate }}</div>
    <app-add-folder class="mt-3" [showCheckBoxes]="true"></app-add-folder>
    <div class="mt-4" *ngIf="settings">
        <app-toggle-switch [(isChecked)]="settings.lookForNetworkDrives">{{ 'look-for-network-drives' | translate }}</app-toggle-switch>
        <div class="secondary-text mt-1">{{ 'look-for-network-drives-description' | translate }}</div>
    </div>
</div>
