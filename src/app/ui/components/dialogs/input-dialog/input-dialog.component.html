<app-dialog-header [icon]="data?.icon || 'las la-question'" [title]="data?.dialogTitle"></app-dialog-header>
<mat-dialog-content>
    <div class="input-dialog__description secondary-text" *ngIf="data?.description">{{ data.description }}</div>
    <mat-form-field class="input-dialog__field">
        <input matInput [(ngModel)]="data.inputText" placeholder="{{ data?.placeHolderText }}" (keyup.enter)="closeDialog()" />
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
    <app-accent-button class="mr-2" [ngClass]="{ inactive: !this.hasInputText }" [mat-dialog-close]="true">{{
        'ok' | translate
    }}</app-accent-button>
    <app-transparent-button [mat-dialog-close]="false">{{ 'cancel' | translate }}</app-transparent-button>
</mat-dialog-actions>
