<div class="like-dislike" [style.font-size.px]="fontSize" [style.line-height]="lineHeight">
    <div
        class="pointer"
        [ngClass]="this.likeClasses"
        (click)="this.likeAsync(); $event.stopPropagation()"
        [title]="'like' | translate"
    ></div>
    <div
        class="pointer"
        [ngClass]="this.dislikeClasses"
        (click)="this.dislikeAsync(); $event.stopPropagation()"
        [title]="'dislike' | translate"
    ></div>
</div>
