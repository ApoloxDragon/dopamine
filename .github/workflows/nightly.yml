name: Nightly builds
env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on:
    workflow_dispatch:
    # No schedule: builds of every platform each night (also when nothing changed) are wasted compute on a fork, and made
    # GitHub turn workflows off. Run it by hand from the Actions tab when a test build is wanted.

jobs:
    nightly_build_on_linux:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: cache Electron downloads
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: cache Angular build
              uses: actions/cache@v4
              with:
                  path: .angular/cache
                  key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                  restore-keys: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: update package directory
              run: sudo apt update
            - name: install rpm, libarchive and squashfs-tools
              run: sudo apt install rpm libarchive-tools squashfs-tools
            - name: install dependencies
              run: npm ci
            - name: run unit tests
              run: npm run test
            - name: build
              run: |
                  for i in 1 2 3; do
                    npm run electron:linux && break
                    if [ "$i" -eq 3 ]; then
                      echo "Linux build failed after 3 attempts"
                      exit 1
                    fi
                    echo "Linux build failed (attempt $i), retrying in 30s..."
                    sleep 30
                  done
            - name: repackage AppImage with fuse3 runtime
              run: bash scripts/repackage-appimage-fuse3.sh release x86_64
            - name: uploading rpm artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-rpm
                  path: release/Dopamine-*.rpm
            - name: upload deb artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-deb
                  path: release/Dopamine-*.deb
            - name: upload appimage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-appimage
                  path: release/Dopamine-*.AppImage
            - name: upload snap artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-snap
                  path: release/Dopamine-*.snap

    nightly_build_pacman_on_arch:
        runs-on: ubuntu-22.04
        container:
            image: archlinux:latest
        steps:
            - uses: actions/checkout@v4
            - name: cache Electron downloads
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: cache Angular build
              uses: actions/cache@v4
              with:
                  path: .angular/cache
                  key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                  restore-keys: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: verify Node runtime
              run: |
                  node -v
                  npm -v
            - name: install Arch dependencies
              run: |
                  pacman -Syu --noconfirm
                  pacman -S --noconfirm git python base-devel libarchive libxcrypt-compat
            - name: install dependencies
              run: npm ci
            - name: run unit tests
              run: npm run test
            - name: build pacman package
              run: |
                  npm run build:prod
                  for i in 1 2 3; do
                    npx electron-builder build --linux pacman --config electron-builder.config.js && break
                    if [ "$i" -eq 3 ]; then
                      echo "Pacman build failed after 3 attempts"
                      exit 1
                    fi
                    echo "Pacman build failed (attempt $i), retrying in 30s..."
                    sleep 30
                  done
            - name: upload pacman artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-pacman
                  path: release/Dopamine-*.pacman

    nightly_build_on_mac_arm:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v4
            - name: cache Electron downloads
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: cache Angular build
              uses: actions/cache@v4
              with:
                  path: .angular/cache
                  key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                  restore-keys: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: install dependencies
              run: npm ci
            - name: run unit tests
              run: npm run test
            - name: build
              run: npm run electron:mac
            - name: name macOS ARM release asset
              shell: bash
              run: |
                  shopt -s nullglob
                  files=(release/Dopamine-*.dmg)
                  if [ "${#files[@]}" -ne 1 ]; then
                    echo "Expected exactly one macOS ARM DMG, found ${#files[@]}" >&2
                    exit 1
                  fi
                  mv -- "${files[0]}" "${files[0]%.dmg}-arm.dmg"
            - name: upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-macos-arm
                  path: release/Dopamine-*.dmg

    nightly_build_on_mac_intel:
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v4
            - name: cache Electron downloads
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: cache Angular build
              uses: actions/cache@v4
              with:
                  path: .angular/cache
                  key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                  restore-keys: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: install dependencies
              run: npm ci
            - name: run unit tests
              run: npm run test
            - name: build
              run: npm run electron:mac
            - name: name macOS Intel release asset
              shell: bash
              run: |
                  shopt -s nullglob
                  files=(release/Dopamine-*.dmg)
                  if [ "${#files[@]}" -ne 1 ]; then
                    echo "Expected exactly one macOS Intel DMG, found ${#files[@]}" >&2
                    exit 1
                  fi
                  mv -- "${files[0]}" "${files[0]%.dmg}-intel.dmg"
            - name: upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-macos-intel
                  path: release/Dopamine-*.dmg

    nightly_build_on_win:
        runs-on: windows-2022

        steps:
            - uses: actions/checkout@v4
            - name: cache Electron downloads
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - name: cache Angular build
              uses: actions/cache@v4
              with:
                  path: .angular/cache
                  key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                  restore-keys: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run unit tests
              run: npm run test
            - name: Build
              run: npm run electron:windows
            - name: Upload Windows installer for checksums
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-windows-installer
                  path: release/Dopamine-*.exe
                  if-no-files-found: error
            # Use built-in 7zip (already installed on the runner)
            - name: Create 7z Archive
              shell: powershell
              run: |
                  cd release
                  & "C:\Program Files\7-Zip\7z.exe" a ..\dopamine-nightly-win.7z Dopamine-*.exe
            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-win
                  path: dopamine-nightly-win.7z

    nightly_checksums:
        runs-on: ubuntu-22.04
        permissions:
            actions: write
            contents: read
        needs:
            - nightly_build_on_linux
            - nightly_build_pacman_on_arch
            - nightly_build_on_mac_arm
            - nightly_build_on_mac_intel
            - nightly_build_on_win
        steps:
            - uses: actions/checkout@v4
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: build-artifacts
                  pattern: dopamine-nightly-*
            - name: Generate release checksums
              run: bash scripts/generate-release-checksums.sh build-artifacts nightly > SHA256SUMS.txt
            - name: Upload release checksums
              uses: actions/upload-artifact@v4
              with:
                  name: dopamine-nightly-checksums
                  path: SHA256SUMS.txt
                  if-no-files-found: error
            - name: Delete temporary Windows installer artifact
              uses: actions/github-script@v7
              with:
                  script: |
                      const artifactName = 'dopamine-nightly-windows-installer';
                      const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: context.runId,
                      });
                      const matches = artifacts.filter((artifact) => artifact.name === artifactName);
                      if (matches.length !== 1) {
                        throw new Error(`Expected exactly one ${artifactName} artifact, found ${matches.length}`);
                      }
                      await github.rest.actions.deleteArtifact({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        artifact_id: matches[0].id,
                      });
                      core.info(`Deleted temporary artifact ${artifactName}`);
